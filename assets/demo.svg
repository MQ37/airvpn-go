<title>airvpn-go interactive menu (illustrative session)</title>
<style>text{font:14px ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;white-space:pre}.f{fill:#d7dde6}.d{fill:#7f8a99}.p{fill:#3fb950}.a{fill:#2ee6c8}.y{fill:#e3b341}.t{fill:#97a3b3;font-size:12px}</style>
<rect width="760" height="668" rx="12" fill="#0e1218"/>
